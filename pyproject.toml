[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "big-d"
version = "0.1.0"
description = "A minimal, pandas-inspired DataFrame implementation built from scratch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prettytable>=3.16.0",
    "requests>=2.32.4",
]

[project.optional-dependencies]
dev = [
    "build>=1.3.0",
    "coverage>=7.9.2",
    "pdoc>=15.0.4",
    "pipenv>=2025.0.4",
    "pre_commit>=4.2.0",
    "ruff>=0.12.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/big_d"]
